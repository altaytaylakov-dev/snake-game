<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка ест Арбуз 🍉</title>
    <style>
        body {
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(46, 213, 115, 0.5);
        }
        #score {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #2ed573;
            text-shadow: 0 0 10px rgba(46, 213, 115, 0.3);
        }
        #hint {
            font-size: 15px;
            color: #2ed573;
            margin-bottom: 15px;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        canvas {
            border: 4px solid #2ed573;
            background-color: #0c0c14;
            box-shadow: 0 0 40px rgba(46, 213, 115, 0.25);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <h1>Змейка ест Арбуз 🍉</h1>
    <div id="score">Счет: 0</div>
    <div id="hint">⌨️ Нажмите любую стрелочку или WASD, чтобы запустить игру со звуком!</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const box = 20;
        let score = 0;

        let snake = [
            { x: 9 * box, y: 10 * box },
            { x: 8 * box, y: 10 * box },
            { x: 7 * box, y: 10 * box }
        ];

        let watermelon = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };

        let d = "RIGHT";
        let nextD = "RIGHT";
        let particles = [];
        let gameStarted = false;
        let gameInterval = null;

        // --- ВСТРОЕННЫЙ АУДИО СИНТЕЗАТОР (Web Audio API) ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Звук поедания арбуза (приятный звонкий аккорд)
        function playEatSound() {
            initAudio();
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = "square";
            osc.frequency.setValueAtTime(450, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.2);
        }

        // Звук проигрыша
        function playGameOverSound() {
            initAudio();
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(70, now + 0.4);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.4);
        }
        --------------------------------------------------

        document.addEventListener("keydown", direction);

        function direction(event) {
            let key = event.keyCode;

            if (!gameStarted) {
                if (key == 37 || key == 38 || key == 39 || key == 40 || key == 65 || key == 87 || key == 68 || key == 83) {
                    gameStarted = true;
                    initAudio();
                    document.getElementById("hint").style.display = "none";
                    gameInterval = setInterval(draw, 115);
                }
            }

            if ((key == 37 || key == 65) && d != "RIGHT") { nextD = "LEFT"; }
            else if ((key == 38 || key == 87) && d != "DOWN") { nextD = "UP"; }
            else if ((key == 39 || key == 68) && d != "LEFT") { nextD = "RIGHT"; }
            else if ((key == 40 || key == 83) && d != "UP") { nextD = "DOWN"; }
        }

        function createParticles(x, y) {
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x: x + box / 2,
                    y: y + box / 2,
                    vx: (Math.random() - 0.5) * 7,
                    vy: (Math.random() - 0.5) * 7,
                    color: Math.random() > 0.4 ? "#ff4757" : "#2ed573",
                    life: 30
                });
            }
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) {
                    return true;
                }
            }
            return false;
        }

        function draw() {
            d = nextD;

            ctx.fillStyle = "#0c0c14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Частицы
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Змейка
            for (let i = 0; i < snake.length; i++) {
                let segment = snake[i];
                if (i === 0) {
                    ctx.fillStyle = "#2ed573";
                    ctx.beginPath();
                    ctx.roundRect(segment.x + 1, segment.y + 1, box - 2, box - 2, 8);
                    ctx.fill();
                } else {
                    ctx.fillStyle = "#7bed9f";
                    ctx.beginPath();
                    ctx.roundRect(segment.x + 2, segment.y + 2, box - 4, box - 4, 6);
                    ctx.fill();
                }
            }

            // Арбуз
            ctx.font = `${box - 2}px Arial`;
            ctx.fillText("🍉", watermelon.x + 1, watermelon.y + box - 3);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (d == "LEFT") snakeX -= box;
            if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box;
            if (d == "DOWN") snakeY += box;

            // Съел арбуз
            if (snakeX == watermelon.x && snakeY == watermelon.y) {
                score++;
                document.getElementById("score").innerText = "Счет: " + score;
                createParticles(watermelon.x, watermelon.y);
                playEatSound(); // Вызов встроенного звука
                
                watermelon = {
                    x: Math.floor(Math.random() * 20) * box,
                    y: Math.floor(Math.random() * 20) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            // Проверка проигрыша
            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(gameInterval);
                playGameOverSound();
                
                setTimeout(() => {
                    alert("Игра окончена! Ваш счет: " + score);
                    location.reload();
                }, 400);
                return;
            }

            snake.unshift(newHead);
        }

        // Отрисовка поля до старта
        ctx.fillStyle = "#0c0c14";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = `${box - 2}px Arial`;
        ctx.fillText("🍉", watermelon.x + 1, watermelon.y + box - 3);
    </script>

</body>
</html>
